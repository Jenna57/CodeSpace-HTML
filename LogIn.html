<!doctype html>
<html lang = en>
<head>
<meta charset = "utf-8">
<meta name= "viewport" content = "width= device-width, scale=1">
<title>Log In</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
<link rel="stylesheet" href = "style.css">
</head>
<body>
<br>
<div class="container">
<form class = "row">
<div class = "col-6">
<label for = "InputEmail" class = "form-label"><strong>Email</strong></label>
<input type = "email" class = "form-control" id = "InputEmail" placeholder="example@gmail.com" required>
</div>
<div class="d-grid gap-2"></div>
<div class = "col-6">
<label for = "InputPassword" class = "form-label"><strong>Password<strong></label>
<input type = "password" class = "form-control" id="InputPassword" required>
</div>
<div class="d-grid gap-2">
<br>
<div class = "row">
<div class "col-6">
<button type = "button" class = "btn btn-info btn-sm">Submit</button>
</div>
<br>
<br>
<div>
<p>Don't have an account yet?</p>
</div>
<div><a href= "RegistrationPage.html">Sign up here</a>
</div>
</form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</body>
</html>
