<!doctype html>
<html lang = en>
<head>
<meta charset = "utf-8">
<meta name= "viewport" content = "width= device-width, scale=1">
<title>Registration Page</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
<link rel="stylesheet" href = "style.css">
</head>
<body>
<br>
<form class = "row">
<h2 class="big-header">Register with us today! <span class="badge bg-info">Better Together</span></h2>
<div class = "col-6">
<label for = "InputEmail" class = "form-label">Email</label>
<input type = "email" class = "form-control" id = "InputEmail" placeholder="example@gmail.com" required><i class="bi bi-person-circle-dark"></i>
</div>
<div class="d-grid gap-2"></div>
<div class = "col-6">
<label for = "InputPassword" class = "form-label">Password</label>
<input type = "password" class = "form-control" id="InputPassword" required>
</div>
<div class="d-grid gap-2"></div>
<div class = "col-6">
<label for = "InputPassword" class = "form-label">Confirm Password</label>
<input type = "password" class = "form-control" id="InputPassword" required>
</div>
<div class="d-grid gap-2"></div>
<div class = "col-6">
<label for= "FirstName" class = "FirstName">First Name<label>
</div>
<div class="d-grid gap-2"></div>
<div class="col-6">
<input type="name" class="form-control" type="text" id="FirstName" required> 
</div>
<div class="d-grid gap-2"></div>
<div class = "col-6">
<label for= "LasttName" class = "LastName">Last Name<label>
</div>
<div class="d-grid gap-2"></div>
<div class = "col-6">
<input type="name" class="form-control" type="text" id="LastName" required> 
</div>
<div class="d-grid gap-2">
<div class = "col-6">
<label for= "DateofBirth" class = "DateofBirth">Date of Birth<label>
</div>
<div class="col-4">
<input type="DateofBirth" class="form-control" type="text" id="DateofBirth" placeholder="DD/MM/YYYY" required> 
</div>
<div class="d-grid gap-2">
<br>
<div class="input-group col-2">
  <label class="input-group-text col-3" for="inputGroupSelect01">How did you find out about our company?</label>
  <select class="form-select col-4" id="inputGroupSelect01">
    <option selected>Please choose one...</option>
    <option value="1">Social Media</option>
    <option value="2">Family/Friend</option>
    <option value="3">TV Advert</option>
	<option value="4">Leafllet</option>
	<option value="5">Other</option>
  </select>
</div>
<br>
<h5 class= "header"> Are you a UK citizen?</h5>
<div class="form-check">
  <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
  <label class="form-check-label" for="flexCheckDefault">
    Yes
  </label>
  </div>
  <div class="form-check">
  <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
  <label class="form-check-label" for="flexCheckDefault">
    No
  </label>
</div>
<br>
<div class = "row">
<div class "col-6">
<button type = "button" class = "btn btn-primary btn-sm">Submit</button>
<br>
<div class="alert alert-success alert-dismissible fade show" role="alert">
  <strong>Thank you!</strong> Once you have clicked submit, remember to follow our page for more info!
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
</div>
</form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</body>
</html>
